<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page Not Found â€” GTA6Store</title>
<meta name="description" content="The page you're looking for doesn't exist. Head back to GTA6Store to pre-book GTA 6."/>
<meta name="robots" content="noindex, follow"/>
<link rel="canonical" href="https://gta6store.co.uk/"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<style>
:root{
  --gold:#C9A84C;--gold-light:#E8C96A;
  --bg:#080809;--bg2:#0C0C0F;
  --surface:#13131A;
  --border:rgba(255,255,255,.055);--border2:rgba(201,168,76,.20);
  --text:#F0EDE4;--text2:#9A9489;--text3:#524E48;
  --font-title:'Bebas Neue','Arial Black',sans-serif;
  --font-body:'Barlow',Arial,sans-serif;
  --font-cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;overflow:hidden;}

/* Background */
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(201,168,76,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.025) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0;}
.bg-glow{position:fixed;inset:0;background:radial-gradient(ellipse 55% 60% at 50% 50%,rgba(192,57,43,.06),transparent);pointer-events:none;z-index:0;}

/* Content */
.error-wrap{position:relative;z-index:1;text-align:center;max-width:560px;}

/* Big 404 */
.error-bg-num{font-family:var(--font-title);font-size:clamp(160px,28vw,260px);line-height:1;color:rgba(201,168,76,.055);letter-spacing:-4px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;user-select:none;white-space:nowrap;}

/* Card */
.error-card{background:var(--surface);border:.5px solid var(--border2);padding:3rem 3.5rem;position:relative;overflow:hidden;animation:fadeup .5s cubic-bezier(.4,0,.2,1);}
.error-card::before{content:'';position:absolute;top:0;left:0;right:0;height:.5px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
@keyframes fadeup{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

.error-code{font-family:var(--font-cond);font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:1.25rem;display:flex;align-items:center;justify-content:center;gap:12px;}
.error-code::before,.error-code::after{content:'';height:.5px;width:28px;background:var(--gold);}
.error-title{font-family:var(--font-title);font-size:clamp(52px,10vw,80px);line-height:.92;letter-spacing:2px;margin-bottom:.75rem;}
.error-title span{color:var(--gold);}
.error-sub{font-size:15px;color:var(--text2);line-height:1.8;margin-bottom:2.5rem;}

.error-actions{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#000;padding:14px 32px;font-family:var(--font-cond);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:background .2s ease;}
.btn-primary:hover{background:var(--gold-light);}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--text2);border:.5px solid var(--border2);padding:14px 28px;font-family:var(--font-cond);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:all .2s ease;}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}

/* Nav micro */
.error-nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem;height:58px;background:rgba(8,8,9,.88);backdrop-filter:blur(20px);border-bottom:.5px solid var(--border);}
.nav-logo{font-family:var(--font-title);font-size:20px;letter-spacing:3px;color:var(--gold);text-decoration:none;}
.nav-logo span{color:var(--text3);}

/* Countdown hint */
.error-hint{margin-top:2.5rem;padding-top:2rem;border-top:.5px solid var(--border);font-family:var(--font-cond);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);}
.error-hint strong{color:var(--gold);}

@media(max-width:560px){
  .error-card{padding:2.5rem 2rem;}
  .error-actions{flex-direction:column;align-items:center;}
  .btn-primary,.btn-ghost{width:100%;justify-content:center;}
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<nav class="error-nav">
  <a href="/" class="nav-logo">GTA6<span>Store</span>.in</a>
</nav>

<div class="error-wrap">
  <div class="error-bg-num">404</div>
  <div class="error-card">
    <div class="error-code">Error 404</div>
    <h1 class="error-title">Page Not<br/><span>Found</span></h1>
    <p class="error-sub">The page you're looking for doesn't exist, was moved, or is still in development. Don't worry â€” GTA 6 is still coming.</p>
    <div class="error-actions">
      <a href="/" class="btn-primary">Back to Home â†’</a>
      <a href="/news" class="btn-ghost">GTA 6 News</a>
    </div>
    <div class="error-hint">GTA 6 releases <strong>November 19, 2026</strong> â€” <a href="/#booking" style="color:var(--text3);text-decoration:none;">pre-book your copy</a></div>
  </div>
</div>
</body>
</html>
